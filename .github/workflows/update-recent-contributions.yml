name: Update recent parliamentary activity

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recent-parliamentary-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build current parliamentary activity datasets
        run: npm run build:parliamentary

      - name: Commit changed datasets
        id: commit
        run: |
          if git diff --quiet -- src/data/members-lookup.json src/data/derived/recent-member-contributions.json src/data/derived/recent-sports-contributions.json src/data/derived/recent-work-contributions.json src/data/derived/recent-questions.json src/data/derived/recent-sports-questions.json src/data/derived/recent-work-questions.json src/data/derived/recent-housing-contributions.json src/data/derived/recent-housing-questions.json src/data/derived/recent-transport-contributions.json src/data/derived/recent-transport-questions.json src/data/derived/recent-education-contributions.json src/data/derived/recent-education-questions.json; then
            echo "No parliamentary activity changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/members-lookup.json src/data/derived/recent-member-contributions.json src/data/derived/recent-sports-contributions.json src/data/derived/recent-work-contributions.json src/data/derived/recent-questions.json src/data/derived/recent-sports-questions.json src/data/derived/recent-work-questions.json src/data/derived/recent-housing-contributions.json src/data/derived/recent-housing-questions.json src/data/derived/recent-transport-contributions.json src/data/derived/recent-transport-questions.json src/data/derived/recent-education-contributions.json src/data/derived/recent-education-questions.json
          git commit -m "Update recent parliamentary activity"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated data
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy.yml",
              ref: "main"
            });
